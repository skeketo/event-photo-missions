<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>{{ app_name }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <main class="page">
    <section class="card">
      <div class="tag">{{ event_date }}</div>

      <h1>Event Photo Missions</h1>

      <p class="intro">
        Queremos ver el evento desde vuestros ojos.
        Sube tus fotos y vídeos, completa misiones y ayúdanos a guardar los mejores recuerdos del día.
      </p>

      <div class="buttons">
        <a href="/subir" class="btn primary">Subir foto o vídeo</a>
        <a href="/misiones" class="btn">Ver misiones</a>
        <a href="/ranking" class="btn">Ver ranking</a>
      </div>

      <p class="footer">
        Gracias por formar parte de nuestra historia.
      </p>
    </section>
  </main>
</body>
</html>
