<!doctype html>
<html lang="{{ language|default('es') }}">
<head>
  <meta charset="utf-8">
  <title>{{ app_name }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <main class="page hero">
    <section class="card">
      <div class="tag">{{ t("app_public_tagline") }}</div>

      <h1>{{ app_name }}</h1>

      <div class="tag">{{ event_date }}</div>

      <h2>{{ t("home_title") }}</h2>

      <p class="intro">
        {{ t("home_intro") }}
      </p>

      <div class="buttons">
        <a href="/misiones" class="btn primary">{{ t("home_find_missions") }}</a>
        <a href="/subir" class="btn">{{ t("home_upload") }}</a>
        <a href="/ranking" class="btn">{{ t("home_ranking") }}</a>
      </div>

      <div class="buttons">
        <a href="/admin/login" class="btn small">Admin</a>
      </div>
    </section>
  </main>
</body>
</html>
