<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Acceso admin - {{ app_name }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <main class="page">
    <section class="card">
      <div class="tag">Panel privado</div>

      <h1>Acceso admin</h1>

      <p class="intro">
        Introduce usuario y contraseña{% if twofa_enabled %}, además del código 2FA{% endif %}.
      </p>

      {% if error %}
        <p class="alert error">{{ error }}</p>
      {% endif %}

      <form method="post" action="/admin/login" class="form">
        <input name="username" placeholder="Usuario" required>
        <input name="password" type="password" placeholder="Contraseña" required>
        {% if twofa_enabled %}
          <input name="token" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="Código 2FA" required>
        {% else %}
          <input name="token" type="hidden" value="">
        {% endif %}

        <button class="btn primary" type="submit">Entrar</button>
      </form>

      <div class="buttons">
        <a href="/" class="btn">Volver a la web pública</a>
      </div>
    </section>
  </main>
</body>
</html>
