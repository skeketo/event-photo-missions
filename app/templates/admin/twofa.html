<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Configurar 2FA - {{ app_name }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <main class="page">
    <section class="card">
      <div class="tag">Configuración 2FA</div>

      <h1>Configurar autenticador</h1>

      <p class="intro">
        Escanea este QR con Microsoft Authenticator, Google Authenticator, Aegis o 2FAS.
      </p>

      <div class="qr-box">
        <img src="data:image/png;base64,{{ qr_base64 }}" alt="QR 2FA">
      </div>

      <p class="intro small">
        También puedes añadirlo manualmente con este secreto:
      </p>

      <p><code>{{ secret }}</code></p>

      <div class="buttons">
        <a href="/admin/login" class="btn primary">Ir al login</a>
        <a href="/" class="btn">Volver</a>
      </div>
    </section>
  </main>
</body>
</html>
